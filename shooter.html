<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    canvas { display: block; cursor: crosshair; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ─────────────────────────────────────────────────────────
//  CANVAS
// ─────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width  = W;
canvas.height = H;

// Scale to fit window while preserving aspect ratio
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
window.addEventListener('resize', resize);
resize();

// ─────────────────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────────────────
const CFG = {
  PLAYER_SPEED     : 190,
  PLAYER_RADIUS    : 12,
  PLAYER_MAX_HP    : 100,
  BULLET_SPEED     : 520,
  BULLET_RADIUS    : 4,
  FIRE_RATE        : 0.14,   // seconds between shots
  INVINCIBLE_TIME  : 0.75,
  SHAKE_DECAY      : 10,
};

// ─────────────────────────────────────────────────────────
//  INPUT
// ─────────────────────────────────────────────────────────
const keys  = {};
const mouse = { x: W / 2, y: H / 2, down: false };

window.addEventListener('keydown', e => { keys[e.key] = true; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); });
window.addEventListener('keyup',   e => { keys[e.key] = false; });

canvas.addEventListener('mousemove', e => {
  const r  = canvas.getBoundingClientRect();
  const sx = W / r.width, sy = H / r.height;
  mouse.x  = (e.clientX - r.left) * sx;
  mouse.y  = (e.clientY - r.top)  * sy;
});
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup',   () => mouse.down = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ─────────────────────────────────────────────────────────
//  ENEMY TYPE TABLE
// ─────────────────────────────────────────────────────────
const ENEMY_TYPES = {
  WALKER  : { speed: 65,  hp: 22,  radius: 10, contactDmg: 10, score: 10, color: '#cc3322', shootInterval: 0,   keepDist: 0,   chargeSpd: 0,   chargeCd: 0,   splits: 0 },
  CHARGER : { speed: 38,  hp: 16,  radius:  9, contactDmg: 22, score: 20, color: '#ff2266', shootInterval: 0,   keepDist: 0,   chargeSpd: 270, chargeCd: 2.5, splits: 0 },
  TANK    : { speed: 32,  hp: 100, radius: 18, contactDmg: 30, score: 50, color: '#aa6622', shootInterval: 0,   keepDist: 0,   chargeSpd: 0,   chargeCd: 0,   splits: 0 },
  SHOOTER : { speed: 48,  hp: 30,  radius: 11, contactDmg:  5, score: 35, color: '#bb22dd', shootInterval: 2.2, keepDist: 150, chargeSpd: 0,   chargeCd: 0,   splits: 0 },
  SPLITTER: { speed: 52,  hp: 48,  radius: 14, contactDmg: 15, score: 40, color: '#228844', shootInterval: 0,   keepDist: 0,   chargeSpd: 0,   chargeCd: 0,   splits: 2 },
};

// ─────────────────────────────────────────────────────────
//  LEVEL DATA
// ─────────────────────────────────────────────────────────
const LEVEL_DATA = [
  { waves: [
      [{ t:'WALKER', n:5 }],
      [{ t:'WALKER', n:7 }, { t:'CHARGER', n:1 }],
  ]},
  { waves: [
      [{ t:'WALKER', n:6 }, { t:'CHARGER', n:2 }],
      [{ t:'TANK', n:1 }, { t:'WALKER', n:5 }],
      [{ t:'SHOOTER', n:2 }, { t:'WALKER', n:4 }],
  ]},
  { waves: [
      [{ t:'TANK', n:2 }, { t:'SHOOTER', n:2 }],
      [{ t:'CHARGER', n:4 }, { t:'SPLITTER', n:2 }],
      [{ t:'WALKER', n:6 }, { t:'SHOOTER', n:3 }, { t:'TANK', n:1 }],
  ]},
  { waves: [
      [{ t:'SPLITTER', n:4 }, { t:'SHOOTER', n:3 }],
      [{ t:'TANK', n:3 }, { t:'CHARGER', n:4 }],
      [{ t:'WALKER', n:8 }, { t:'SHOOTER', n:4 }, { t:'SPLITTER', n:2 }],
      [{ t:'TANK', n:2 }, { t:'CHARGER', n:5 }, { t:'SHOOTER', n:3 }],
  ]},
];

function getLevelData(li) {
  if (li < LEVEL_DATA.length) return LEVEL_DATA[li];
  const l = li + 1;
  const wc = 3 + Math.floor(l / 2);
  const waves = [];
  for (let w = 0; w < wc; w++) {
    waves.push([
      { t:'WALKER',   n: Math.floor(5 + l * 1.6 + w) },
      { t:'CHARGER',  n: Math.floor(1 + l * 0.8) },
      { t:'TANK',     n: Math.floor(l * 0.7) },
      { t:'SHOOTER',  n: Math.floor(1 + l * 0.8) },
      { t:'SPLITTER', n: Math.floor(l * 0.4) },
    ].filter(g => g.n > 0));
  }
  return { waves };
}

// ─────────────────────────────────────────────────────────
//  PARTICLES
// ─────────────────────────────────────────────────────────
const particles = [];

function spawnParticles(x, y, color, count, speed, sMin, sMax) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = speed * (0.4 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 0.35 + Math.random() * 0.35, color,
      size: sMin + Math.random() * (sMax - sMin) });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.88; p.vy *= 0.88;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.7);
    ctx.fillStyle   = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────────────────
//  SCREEN SHAKE
// ─────────────────────────────────────────────────────────
let shakeX = 0, shakeY = 0, shakeMag = 0;
function screenShake(mag) { shakeMag = Math.max(shakeMag, mag); }
function updateShake(dt) {
  if (shakeMag > 0.1) {
    shakeX = (Math.random() * 2 - 1) * shakeMag;
    shakeY = (Math.random() * 2 - 1) * shakeMag;
    shakeMag -= CFG.SHAKE_DECAY * dt * shakeMag;
  } else { shakeX = 0; shakeY = 0; shakeMag = 0; }
}

// ─────────────────────────────────────────────────────────
//  BULLET
// ─────────────────────────────────────────────────────────
class Bullet {
  constructor(x, y, vx, vy, owner) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.owner = owner; // 'player' | 'enemy'
    this.radius = CFG.BULLET_RADIUS;
    this.alive = true; this.age = 0;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt; this.age += dt;
    if (this.age > 2.2 || this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20)
      this.alive = false;
  }
}

// ─────────────────────────────────────────────────────────
//  ENEMY
// ─────────────────────────────────────────────────────────
class Enemy {
  constructor(x, y, typeName) {
    const t = ENEMY_TYPES[typeName];
    Object.assign(this, t);           // copy all config fields
    this.id    = typeName;
    this.x     = x; this.y = y;
    this.maxHp = t.hp;
    this.alive = true;
    this.vx    = 0; this.vy = 0;
    this.walkFrame = 0; this.walkTimer = 0;
    this.flashTimer  = 0;
    this.shootTimer  = Math.random() * (t.shootInterval || 2);
    this.chargeTimer = 0;
    this.isCharging  = false;
    this.chargeVx    = 0; this.chargeVy = 0;
  }

  update(dt, player, eBullets) {
    const dx   = player.x - this.x;
    const dy   = player.y - this.y;
    const dist = Math.hypot(dx, dy);
    const ang  = Math.atan2(dy, dx);

    if      (this.id === 'CHARGER') this._charger(dt, dist, ang);
    else if (this.id === 'SHOOTER') this._shooter(dt, dist, ang, eBullets);
    else {
      this.vx = Math.cos(ang) * this.speed;
      this.vy = Math.sin(ang) * this.speed;
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));

    this.walkTimer += dt;
    if (this.walkTimer > 0.14) { this.walkFrame = (this.walkFrame + 1) % 4; this.walkTimer = 0; }
    this.flashTimer = Math.max(0, this.flashTimer - dt);

    // Contact damage (flat amount, gated by invincibility timer)
    if (dist < this.radius + player.radius) player.takeDamage(this.contactDmg);
  }

  _charger(dt, dist, ang) {
    this.chargeTimer -= dt;
    if (this.isCharging) {
      this.vx = this.chargeVx; this.vy = this.chargeVy;
      if (this.chargeTimer <= 0) { this.isCharging = false; this.chargeTimer = this.chargeCd; }
    } else {
      this.vx = Math.cos(ang) * this.speed;
      this.vy = Math.sin(ang) * this.speed;
      if (dist < 220 && this.chargeTimer <= 0) {
        this.isCharging  = true;
        this.chargeTimer = 0.38;
        this.chargeVx    = Math.cos(ang) * this.chargeSpd;
        this.chargeVy    = Math.sin(ang) * this.chargeSpd;
      }
    }
  }

  _shooter(dt, dist, ang, eBullets) {
    if      (dist < this.keepDist)       { this.vx = -Math.cos(ang) * this.speed;       this.vy = -Math.sin(ang) * this.speed; }
    else if (dist > this.keepDist + 70)  { this.vx =  Math.cos(ang) * this.speed * 0.6; this.vy =  Math.sin(ang) * this.speed * 0.6; }
    else                                 { this.vx = 0; this.vy = 0; }
    this.shootTimer -= dt;
    if (this.shootTimer <= 0) {
      this.shootTimer = this.shootInterval;
      const spd = 210;
      eBullets.push(new Bullet(
        this.x + Math.cos(ang) * (this.radius + 2),
        this.y + Math.sin(ang) * (this.radius + 2),
        Math.cos(ang) * spd, Math.sin(ang) * spd, 'enemy'
      ));
    }
  }

  takeDamage(amount) {
    this.hp -= amount; this.flashTimer = 0.1;
    if (this.hp <= 0) this.alive = false;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    const fl  = this.flashTimer > 0;
    const lo  = [0, 3, 0, -3][this.walkFrame];

    if      (this.id === 'WALKER')   this._drawWalker(fl, lo);
    else if (this.id === 'CHARGER')  this._drawCharger(fl);
    else if (this.id === 'TANK')     this._drawTank(fl, lo);
    else if (this.id === 'SHOOTER')  this._drawShooter(fl);
    else if (this.id === 'SPLITTER') this._drawSplitter(fl, lo);

    // HP bar (only when damaged)
    if (this.hp < this.maxHp) {
      const bw = this.radius * 2 + 4, bh = 3, bx = -bw / 2, by = -(this.radius + 7);
      ctx.fillStyle = '#222'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#44ff44'; ctx.fillRect(bx, by, bw * (this.hp / this.maxHp), bh);
    }
    ctx.restore();
  }

  _drawWalker(fl, lo) {
    ctx.fillStyle = fl ? '#fff' : '#992211';
    ctx.fillRect(-6, 4 + lo, 5, 7); ctx.fillRect(1, 4 - lo, 5, 7);   // legs
    ctx.fillStyle = fl ? '#fff' : this.color;
    ctx.fillRect(-8, -8, 16, 14);                                       // body
    ctx.fillStyle = fl ? '#fff' : '#ee5533';
    ctx.fillRect(-6, -16, 12, 9);                                       // head
    ctx.fillStyle = '#ffff00';
    ctx.fillRect(-5, -14, 3, 3); ctx.fillRect(2, -14, 3, 3);           // eyes
  }

  _drawCharger(fl) {
    ctx.save(); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = fl ? '#fff' : '#aa0044';
    ctx.fillRect(-11, -11, 22, 22);
    ctx.fillStyle = fl ? '#fff' : this.color;
    ctx.fillRect(-7, -7, 14, 14);
    ctx.restore();
    ctx.fillStyle = '#ffff00';
    ctx.fillRect(-4, -4, 3, 3); ctx.fillRect(1, -4, 3, 3);
  }

  _drawTank(fl, lo) {
    ctx.fillStyle = fl ? '#fff' : '#663300';
    ctx.fillRect(-16, -16, 32, 28);                                     // outer shell
    ctx.fillStyle = fl ? '#fff' : this.color;
    ctx.fillRect(-12, -12, 24, 20);                                     // body
    ctx.fillStyle = fl ? '#fff' : '#cc8844';
    ctx.fillRect(-9, -11, 18, 11);                                      // face
    ctx.fillStyle = '#ff2200';
    ctx.fillRect(-8, -10, 6, 5); ctx.fillRect(2, -10, 6, 5);           // angry eyes
    ctx.fillStyle = fl ? '#fff' : '#442200';
    ctx.fillRect(-14, 10 + lo, 7, 9); ctx.fillRect(7, 10 - lo, 7, 9); // legs
  }

  _drawShooter(fl) {
    ctx.fillStyle = fl ? '#fff' : '#660088';
    ctx.beginPath(); ctx.arc(0, 0, this.radius + 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = fl ? '#fff' : this.color;
    ctx.beginPath(); ctx.arc(0, 0, this.radius - 2, 0, Math.PI * 2); ctx.fill();
    // Eye
    ctx.fillStyle = '#ff99ff';
    ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(0, -2, 2, 0, Math.PI * 2); ctx.fill();
  }

  _drawSplitter(fl, lo) {
    ctx.fillStyle = fl ? '#fff' : '#115522';
    ctx.fillRect(-14, -14, 28, 23);
    ctx.fillStyle = fl ? '#fff' : this.color;
    ctx.fillRect(-11, -11, 22, 18);
    ctx.fillStyle = fl ? '#fff' : '#44ff88';
    ctx.fillRect(-1, -10, 2, 16);                                       // split crack
    ctx.fillStyle = '#88ff44';
    ctx.fillRect(-8, -9, 5, 5); ctx.fillRect(3, -9, 5, 5);             // eyes
    ctx.fillStyle = fl ? '#fff' : '#115522';
    ctx.fillRect(-11, 8 + lo, 6, 7); ctx.fillRect(5, 8 - lo, 6, 7);   // legs
  }
}

// ─────────────────────────────────────────────────────────
//  PLAYER
// ─────────────────────────────────────────────────────────
let muzzleFlash = 0;

class Player {
  constructor() {
    this.x      = W / 2;   this.y = H / 2;
    this.angle  = 0;
    this.hp     = CFG.PLAYER_MAX_HP;
    this.maxHp  = CFG.PLAYER_MAX_HP;
    this.radius = CFG.PLAYER_RADIUS;
    this.fireCooldown = 0;
    this.walkFrame = 0;    this.walkTimer = 0;
    this.recoil    = 0;
    this.invincible = 0;
    this.alive  = true;
  }

  update(dt) {
    let vx = 0, vy = 0;
    if (keys['ArrowLeft']  || keys['a']) vx -= 1;
    if (keys['ArrowRight'] || keys['d']) vx += 1;
    if (keys['ArrowUp']    || keys['w']) vy -= 1;
    if (keys['ArrowDown']  || keys['s']) vy += 1;
    const moving = vx !== 0 || vy !== 0;
    if (moving) { const l = Math.hypot(vx, vy); vx /= l; vy /= l; }

    this.x += vx * CFG.PLAYER_SPEED * dt;
    this.y += vy * CFG.PLAYER_SPEED * dt;
    this.x = Math.max(this.radius, Math.min(W - this.radius, this.x));
    this.y = Math.max(this.radius, Math.min(H - this.radius, this.y));

    this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);

    if (moving) {
      this.walkTimer += dt;
      if (this.walkTimer > 0.11) { this.walkFrame = (this.walkFrame + 1) % 4; this.walkTimer = 0; }
    } else { this.walkFrame = 0; }

    this.recoil     = Math.max(0, this.recoil - 18 * dt);
    this.invincible = Math.max(0, this.invincible - dt);
    this.fireCooldown = Math.max(0, this.fireCooldown - dt);
  }

  tryShoot(pBullets) {
    if (!mouse.down || this.fireCooldown > 0) return;
    this.fireCooldown = CFG.FIRE_RATE;
    this.recoil = 5;
    muzzleFlash = 0.07;
    const dist = 18 - this.recoil;
    const bx = this.x + Math.cos(this.angle) * dist;
    const by = this.y + Math.sin(this.angle) * dist;
    pBullets.push(new Bullet(bx, by, Math.cos(this.angle) * CFG.BULLET_SPEED, Math.sin(this.angle) * CFG.BULLET_SPEED, 'player'));
    spawnParticles(bx, by, '#ffff88', 3, 100, 2, 4);
  }

  takeDamage(amount) {
    if (this.invincible > 0) return;
    this.hp = Math.max(0, this.hp - amount);
    this.invincible = CFG.INVINCIBLE_TIME;
    screenShake(5);
    if (this.hp <= 0) {
      this.alive = false;
      spawnParticles(this.x, this.y, '#44ff88', 22, 220, 3, 8);
      screenShake(18);
    }
  }

  draw() {
    const blink = this.invincible > 0 && Math.floor(this.invincible * 12) % 2 === 0;
    if (blink) return;

    ctx.save();
    ctx.translate(this.x, this.y);

    const lo = [0, 3, 0, -3][this.walkFrame];

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(0, 16, 11, 4, 0, 0, Math.PI * 2); ctx.fill();

    // Legs
    ctx.fillStyle = '#1a4422';
    ctx.fillRect(-9, 6 + lo, 6, 10);
    ctx.fillRect(3,  6 - lo, 6, 10);

    // Body
    ctx.fillStyle = '#1d5c2e';
    ctx.fillRect(-10, -7, 20, 15);
    ctx.fillStyle = '#2d8c44';
    ctx.fillRect(-8, -5, 16, 11);

    // Chest detail
    ctx.fillStyle = '#1d5c2e';
    ctx.fillRect(-3, -4, 6, 9);

    // Head
    ctx.fillStyle = '#2aaa44';
    ctx.fillRect(-7, -17, 14, 11);
    // Visor
    ctx.fillStyle = '#88ffaa';
    ctx.fillRect(-6, -16, 12, 5);
    ctx.fillStyle = 'rgba(136,255,170,0.4)';
    ctx.fillRect(-6, -11, 12, 3);

    // Gun (rotated toward mouse)
    ctx.save();
    ctx.rotate(this.angle);
    const r = -this.recoil;
    ctx.fillStyle = '#999';
    ctx.fillRect(r,       -3, 14, 6);  // handle
    ctx.fillStyle = '#bbb';
    ctx.fillRect(r + 10,  -2, 10, 4);  // barrel
    ctx.fillStyle = '#777';
    ctx.fillRect(r + 10, -3, 3, 6);   // grip

    if (muzzleFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,100,0.9)';
      ctx.beginPath(); ctx.arc(r + 20, 0, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(r + 20, 0, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────
//  BACKGROUND
// ─────────────────────────────────────────────────────────
function drawBackground() {
  ctx.fillStyle = '#0a0a18';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#0e0e28';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.strokeStyle = '#1a2244';
  ctx.lineWidth = 3;
  ctx.strokeRect(2, 2, W - 4, H - 4);
}

// ─────────────────────────────────────────────────────────
//  HUD
// ─────────────────────────────────────────────────────────
function drawHUD(player, score, level, waveIdx, totalWaves) {
  // HP bar
  const bw = 180, bh = 16, bx = 14, by = 14;
  ctx.fillStyle = '#111';
  ctx.fillRect(bx, by, bw, bh);
  const ratio = player.hp / player.maxHp;
  ctx.fillStyle = ratio > 0.5 ? '#33dd44' : ratio > 0.25 ? '#ffaa00' : '#ff2200';
  ctx.fillRect(bx, by, bw * ratio, bh);
  ctx.strokeStyle = '#334433'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace';
  ctx.fillText(`HP  ${player.hp}`, bx + 5, by + 12);

  // Score
  ctx.fillStyle = '#ffff44'; ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`${score}`, W - 14, 30);
  ctx.fillStyle = '#aaccff'; ctx.font = '11px monospace';
  ctx.fillText(`LVL ${level}   WAVE ${waveIdx + 1} / ${totalWaves}`, W - 14, 50);
  ctx.textAlign = 'left';
}

// ─────────────────────────────────────────────────────────
//  GAME STATE
// ─────────────────────────────────────────────────────────
// MENU | PLAYING | WAVE_COMPLETE | LEVEL_COMPLETE | GAME_OVER
let gameState = 'MENU';
let player = null, pBullets = [], enemies = [], eBullets = [];
let score = 0, levelIdx = 0, waveIdx = 0;
let transitionTimer = 0;
let finalScore = 0;

function spawnAtEdge(typeName) {
  const edge = Math.floor(Math.random() * 4);
  const pad  = 30;
  let x, y;
  if      (edge === 0) { x = Math.random() * W; y = -pad; }
  else if (edge === 1) { x = W + pad;            y = Math.random() * H; }
  else if (edge === 2) { x = Math.random() * W; y = H + pad; }
  else                 { x = -pad;              y = Math.random() * H; }
  return new Enemy(x, y, typeName);
}

function spawnWave(waveData) {
  enemies = [];
  for (const g of waveData) for (let i = 0; i < g.n; i++) enemies.push(spawnAtEdge(g.t));
}

function startGame() {
  score = 0; levelIdx = 0; waveIdx = 0;
  player  = new Player();
  pBullets = []; eBullets = [];
  particles.length = 0; shakeMag = 0;
  spawnWave(getLevelData(levelIdx).waves[waveIdx]);
  gameState = 'PLAYING';
}

// ─────────────────────────────────────────────────────────
//  UPDATE
// ─────────────────────────────────────────────────────────
function update(dt) {
  muzzleFlash = Math.max(0, muzzleFlash - dt);
  updateShake(dt);
  updateParticles(dt);

  if (gameState === 'MENU' || gameState === 'GAME_OVER') {
    if (keys['Enter'] || keys[' ']) startGame();
    return;
  }

  if (gameState === 'WAVE_COMPLETE' || gameState === 'LEVEL_COMPLETE') {
    transitionTimer -= dt;
    player.update(dt);
    if (transitionTimer <= 0) {
      pBullets = []; eBullets = [];
      if (gameState === 'LEVEL_COMPLETE') {
        levelIdx++;
        waveIdx = 0;
        player.hp = Math.min(player.maxHp, player.hp + 30);
      } else {
        waveIdx++;
      }
      spawnWave(getLevelData(levelIdx).waves[waveIdx]);
      gameState = 'PLAYING';
    }
    return;
  }

  // ── PLAYING ──
  player.update(dt);
  player.tryShoot(pBullets);

  if (!player.alive) { finalScore = score; gameState = 'GAME_OVER'; return; }

  // Player bullets
  for (let i = pBullets.length - 1; i >= 0; i--) {
    pBullets[i].update(dt);
    if (!pBullets[i].alive) pBullets.splice(i, 1);
  }

  // Enemy bullets
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.update(dt);
    if (!b.alive) { eBullets.splice(i, 1); continue; }
    if (Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
      player.takeDamage(18);
      spawnParticles(b.x, b.y, '#ff6644', 4, 90, 2, 4);
      b.alive = false; eBullets.splice(i, 1);
    }
  }

  // Enemies
  const born = [];
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.update(dt, player, eBullets);

    // Check player bullets
    for (let j = pBullets.length - 1; j >= 0; j--) {
      const b = pBullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
        e.takeDamage(20);
        spawnParticles(b.x, b.y, e.color, 5, 100, 2, 5);
        b.alive = false; pBullets.splice(j, 1);
        if (!e.alive) {
          score += e.score;
          spawnParticles(e.x, e.y, e.color, 14, 160, 3, 8);
          screenShake(3);
          if (e.splits > 0) {
            for (let s = 0; s < e.splits; s++) {
              const a = Math.random() * Math.PI * 2;
              born.push(new Enemy(e.x + Math.cos(a) * 22, e.y + Math.sin(a) * 22, 'WALKER'));
            }
          }
        }
        break;
      }
    }

    if (!e.alive) enemies.splice(i, 1);
  }
  enemies.push(...born);

  // Wave / level complete?
  if (enemies.length === 0) {
    const ld = getLevelData(levelIdx);
    if (waveIdx >= ld.waves.length - 1) {
      score += 200 * (levelIdx + 1);
      gameState = 'LEVEL_COMPLETE';
      transitionTimer = 3.2;
    } else {
      gameState = 'WAVE_COMPLETE';
      transitionTimer = 2.0;
    }
  }
}

// ─────────────────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────────────────
function render() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();

  // Enemy bullets
  for (const b of eBullets) {
    ctx.fillStyle = '#ff4444';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9999';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius - 1.5, 0, Math.PI * 2); ctx.fill();
  }

  // Player bullets
  for (const b of pBullets) {
    ctx.fillStyle = '#ffff44';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius - 1.5, 0, Math.PI * 2); ctx.fill();
  }

  for (const e of enemies) e.draw();
  if (player && player.alive) player.draw();

  drawParticles();
  ctx.restore();

  // HUD (no shake)
  if (player && gameState !== 'MENU' && gameState !== 'GAME_OVER') {
    drawHUD(player, score, levelIdx + 1, waveIdx, getLevelData(levelIdx).waves.length);
  }

  // Overlay
  if (gameState === 'MENU') {
    drawOverlay('RETRO  SHOOTER',
      'ENTER or SPACE to play',
      ['Arrow Keys / WASD  —  Move',
       'Mouse  —  Aim',
       'Left Click  —  Shoot',
       '',
       '5 enemy types   •   4+ levels']);
  } else if (gameState === 'GAME_OVER') {
    drawOverlay('GAME  OVER',
      `Score: ${finalScore}`,
      ['ENTER or SPACE to restart']);
  } else if (gameState === 'WAVE_COMPLETE') {
    drawBanner('WAVE CLEAR !', '#44ffaa');
  } else if (gameState === 'LEVEL_COMPLETE') {
    drawBanner(`LEVEL ${levelIdx + 1} COMPLETE  +${200*(levelIdx+1)}`, '#ffff44');
  }
}

function drawOverlay(title, sub, lines) {
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3355';
  ctx.font = 'bold 58px monospace';
  ctx.fillText(title, W / 2, H / 2 - 90);
  ctx.fillStyle = '#ffff44';
  ctx.font = 'bold 22px monospace';
  ctx.fillText(sub, W / 2, H / 2 - 38);
  ctx.fillStyle = '#99aacc';
  ctx.font = '16px monospace';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 10 + i * 28));
  ctx.textAlign = 'left';
}

function drawBanner(text, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, H / 2 - 36, W, 72);
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.font = 'bold 34px monospace';
  ctx.fillText(text, W / 2, H / 2 + 12);
  ctx.textAlign = 'left';
}

// ─────────────────────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
