<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; width: 200px; height: 240px; }
  canvas { display: block; cursor: default; -webkit-app-region: no-drag; }
</style>
</head>
<body>
<canvas id="c" width="200" height="240"></canvas>
<script>
// ═══════════════════════════════════════════════════════════
//  CLAUDE DESKTOP PET  -  renderer
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 200, H = 240;

// ── Colours ─────────────────────────────────────────────
const COL = {
  body:      '#E8885C',
  bodyLight: '#F4A87A',
  bodyDark:  '#C96A3E',
  outline:   '#A85232',
  eyeWhite:  '#FFFFFF',
  pupil:     '#2D2D2D',
  shine:     '#FFFFFF',
  blush:     'rgba(255,140,120,0.45)',
  mouth:     '#6B3422',
  bubble:    '#FFFFFF',
  bubbleBdr: '#D0D0D0',
  bubbleTxt: '#333333',
  shadow:    'rgba(0,0,0,0.12)',
};

// ── State ───────────────────────────────────────────────
let state       = 'idle';        // idle | walk | talk | think | sleep | drag
let prevState   = 'idle';
let stateTimer  = rand(3, 6);
let walkDir     = Math.random() < 0.5 ? 1 : -1;
let walkPhase   = 0;

let blinkTimer  = rand(3, 6);
let isBlinking  = false;

let speechText  = '';
let speechTimer = 0;

let sleepBob    = 0;

let bobOff      = 0;
let breathe     = 0;

// Screen / window info (filled on init)
let screenW = 1920, screenH = 1080;
let winX = 0, winY = 0;

// Mouse / drag
let isHovered  = false;
let isDragging = false;
let dragOff    = { x: 0, y: 0 };

// Character position on canvas
const charX = W / 2;
const charBaseY = 155;

// ── Messages ────────────────────────────────────────────
const MESSAGES = [
  "Hello! :D",
  "I'm here to help!",
  "Let me think...",
  "What a lovely day!",
  "Need anything?",
  "I'm Claude~",
  "Let's reason\nstep by step!",
  "Stay curious!",
  "I appreciate you!",
  "*happy noises*",
  "Thinking deeply...",
  "Hi there~",
  "Have a great day!",
  "I love learning!",
  "You're doing great!",
];

const THINK_MSGS = [
  "Hmm...",
  "Let me see...",
  "Interesting...",
  "I wonder...",
];

// ── Helpers ─────────────────────────────────────────────
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr)  { return arr[Math.floor(Math.random() * arr.length)]; }

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Init ────────────────────────────────────────────────
async function init() {
  try {
    const sz = await window.pet.getScreenSize();
    screenW = sz.width; screenH = sz.height;
    const pos = await window.pet.getWindowPos();
    winX = pos.x; winY = pos.y;
  } catch(e) { /* dev fallback */ }
  requestAnimationFrame(loop);
}

// ── State machine ───────────────────────────────────────
function switchState() {
  const r = Math.random();
  if (state === 'sleep') {
    state = 'idle';
    stateTimer = rand(3, 6);
    return;
  }
  if (r < 0.35) {
    state = 'idle';
    stateTimer = rand(3, 7);
  } else if (r < 0.65) {
    state = 'walk';
    walkDir = Math.random() < 0.5 ? 1 : -1;
    stateTimer = rand(2, 6);
  } else if (r < 0.82) {
    state = 'talk';
    speechText = pick(MESSAGES);
    speechTimer = stateTimer = rand(2.5, 4.5);
  } else if (r < 0.94) {
    state = 'think';
    speechText = pick(THINK_MSGS);
    speechTimer = stateTimer = rand(2, 3.5);
  } else {
    state = 'sleep';
    stateTimer = rand(5, 10);
  }
}

// ── Draw: speech bubble ─────────────────────────────────
function drawSpeechBubble(x, y, text, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;

  const lines = text.split('\n');
  ctx.font = 'bold 11px system-ui, sans-serif';
  let maxW = 0;
  for (const l of lines) maxW = Math.max(maxW, ctx.measureText(l).width);

  const pad = 8;
  const lineH = 14;
  const bw = maxW + pad * 2;
  const bh = lines.length * lineH + pad * 2 - 4;
  const bx = x - bw / 2;
  const by = y - bh;

  // Bubble body
  ctx.fillStyle = COL.bubble;
  ctx.strokeStyle = COL.bubbleBdr;
  ctx.lineWidth = 1.5;
  roundRect(ctx, bx, by, bw, bh, 8);
  ctx.fill();
  ctx.stroke();

  // Tail
  ctx.fillStyle = COL.bubble;
  ctx.strokeStyle = COL.bubbleBdr;
  ctx.beginPath();
  ctx.moveTo(x - 6, by + bh);
  ctx.lineTo(x, by + bh + 8);
  ctx.lineTo(x + 6, by + bh);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // cover tail border inside bubble
  ctx.fillStyle = COL.bubble;
  ctx.fillRect(x - 5, by + bh - 2, 10, 3);

  // Text
  ctx.fillStyle = COL.bubbleTxt;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x, by + pad + i * lineH - 1);
  }

  ctx.restore();
}

// ── Draw: thought bubble ────────────────────────────────
function drawThoughtBubble(x, y, text, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.font = 'italic 11px system-ui, sans-serif';
  const tw = ctx.measureText(text).width;
  const pad = 8;
  const bw = tw + pad * 2;
  const bh = 22;
  const bx = x - bw / 2;
  const by = y - bh;

  // Main bubble
  ctx.fillStyle = COL.bubble;
  ctx.strokeStyle = COL.bubbleBdr;
  ctx.lineWidth = 1.5;
  roundRect(ctx, bx, by, bw, bh, 10);
  ctx.fill();
  ctx.stroke();

  // Thought dots
  ctx.fillStyle = COL.bubble;
  ctx.strokeStyle = COL.bubbleBdr;
  const dots = [{r:4, dx:4, dy:10}, {r:2.5, dx:1, dy:18}];
  for (const d of dots) {
    ctx.beginPath();
    ctx.arc(x + d.dx, by + bh + d.dy, d.r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }

  // Text
  ctx.fillStyle = '#888';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, by + bh / 2);

  ctx.restore();
}

// ── Draw: Zzz ───────────────────────────────────────────
function drawSleep(x, y, t) {
  ctx.save();
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(100,150,255,0.6)';
  ctx.textAlign = 'center';

  for (let i = 0; i < 3; i++) {
    const phase = (t * 0.8 + i * 1.2) % 3;
    const alpha = 1 - phase / 3;
    const offX = i * 10 - 5;
    const offY = -phase * 18;
    const sz = 10 + i * 3;
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.font = `bold ${sz}px system-ui, sans-serif`;
    ctx.fillText('z', x + 30 + offX, y - 30 + offY);
  }
  ctx.restore();
}

// ── Draw: character ─────────────────────────────────────
function drawCharacter(x, y, t) {
  const isSleeping = state === 'sleep';

  // ─ Shadow ─
  ctx.fillStyle = COL.shadow;
  ctx.beginPath();
  ctx.ellipse(x, y + 50, 38, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // ─ Feet (behind body) ─
  const footSpread = 14;
  let leftFootOff = 0, rightFootOff = 0;
  if (state === 'walk') {
    leftFootOff  = Math.sin(walkPhase) * 5;
    rightFootOff = Math.sin(walkPhase + Math.PI) * 5;
  }

  ctx.fillStyle = COL.bodyDark;
  // Left foot
  ctx.beginPath();
  ctx.ellipse(x - footSpread + leftFootOff, y + 46, 12, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // Right foot
  ctx.beginPath();
  ctx.ellipse(x + footSpread + rightFootOff, y + 46, 12, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // ─ Body ─
  const br = 42 + Math.sin(breathe) * 1.2; // breathing
  const grad = ctx.createRadialGradient(x - 12, y - 14, 8, x, y, br);
  grad.addColorStop(0, COL.bodyLight);
  grad.addColorStop(1, COL.body);

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(x, y, br, br + 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = COL.outline;
  ctx.lineWidth = 2;
  ctx.stroke();

  // ─ Belly highlight ─
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 24, 20, 0, 0, Math.PI * 2);
  ctx.fill();

  // ─ Eyes ─
  const eyeSpacing = 16;
  const eyeY = y - 8;

  // Look direction during walk
  let lookX = 0;
  if (state === 'walk') lookX = walkDir * 3;
  if (state === 'think') lookX = -2;

  if (isBlinking || isSleeping) {
    // Closed eyes
    ctx.strokeStyle = COL.pupil;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      const ex = x + side * eyeSpacing;
      if (isSleeping) {
        // Peaceful closed eyes (curved down)
        ctx.arc(ex, eyeY + 2, 7, 0.3, Math.PI - 0.3);
      } else {
        // Blink (straight line)
        ctx.moveTo(ex - 7, eyeY);
        ctx.lineTo(ex + 7, eyeY);
      }
      ctx.stroke();
    }
  } else {
    for (const side of [-1, 1]) {
      const ex = x + side * eyeSpacing;

      // White
      ctx.fillStyle = COL.eyeWhite;
      ctx.beginPath();
      ctx.ellipse(ex, eyeY, 10, 11, side * 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = COL.outline;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Pupil
      ctx.fillStyle = COL.pupil;
      ctx.beginPath();
      ctx.arc(ex + lookX + side * 1.5, eyeY + 1, 5.5, 0, Math.PI * 2);
      ctx.fill();

      // Shine
      ctx.fillStyle = COL.shine;
      ctx.beginPath();
      ctx.arc(ex + lookX + side * 1.5 + 2, eyeY - 2, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ─ Blush ─
  ctx.fillStyle = COL.blush;
  ctx.beginPath();
  ctx.ellipse(x - 30, y + 4, 9, 5, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + 30, y + 4, 9, 5, 0.15, 0, Math.PI * 2);
  ctx.fill();

  // ─ Mouth ─
  ctx.strokeStyle = COL.mouth;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();

  if (isSleeping) {
    // Small "o" for sleeping
    ctx.fillStyle = COL.mouth;
    ctx.beginPath();
    ctx.ellipse(x, y + 14, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (state === 'talk') {
    // Open happy mouth
    ctx.beginPath();
    ctx.arc(x, y + 10, 12, 0.15, Math.PI - 0.15);
    ctx.stroke();
    // Tongue
    ctx.fillStyle = '#E86050';
    ctx.beginPath();
    ctx.arc(x, y + 18, 5, Math.PI, 0);
    ctx.fill();
  } else if (state === 'think') {
    // Slight pout
    ctx.beginPath();
    ctx.arc(x + 2, y + 16, 8, Math.PI + 0.4, -0.4);
    ctx.stroke();
  } else {
    // Default smile
    ctx.beginPath();
    ctx.arc(x, y + 10, 10, 0.2, Math.PI - 0.2);
    ctx.stroke();
  }

  // ─ Arms ─
  ctx.strokeStyle = COL.bodyDark;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';

  let armWave = 0;
  if (state === 'walk') armWave = Math.sin(walkPhase + Math.PI * 0.5) * 0.3;
  if (state === 'talk') armWave = Math.sin(t * 4) * 0.15;

  // Left arm
  ctx.beginPath();
  ctx.moveTo(x - br + 8, y + 6);
  ctx.lineTo(x - br - 6, y + 22 + Math.sin(t * 2 + armWave) * 3);
  ctx.stroke();

  // Right arm
  ctx.beginPath();
  ctx.moveTo(x + br - 8, y + 6);
  if (state === 'talk') {
    // Waving arm
    ctx.lineTo(x + br + 4, y - 4 + Math.sin(t * 5) * 6);
  } else {
    ctx.lineTo(x + br + 6, y + 22 + Math.sin(t * 2.3 - armWave) * 3);
  }
  ctx.stroke();

  // ─ Small "C" on belly ─
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(x, y + 24, 8, 0.5, Math.PI * 2 - 0.5);
  ctx.stroke();
}

// ── Hit test ────────────────────────────────────────────
function isOverCharacter(mx, my) {
  const cy = charBaseY + bobOff;
  const dx = mx - charX;
  const dy = my - cy;
  return (dx * dx + dy * dy) < 55 * 55;
}

// ── Mouse events ────────────────────────────────────────
canvas.addEventListener('mousemove', (e) => {
  const over = isOverCharacter(e.clientX, e.clientY);
  if (over !== isHovered) {
    isHovered = over;
    try { window.pet.setIgnoreMouse(!over); } catch(e) {}
  }
  if (isDragging) {
    const nx = e.screenX - dragOff.x;
    const ny = e.screenY - dragOff.y;
    winX = nx; winY = ny;
    try { window.pet.moveWindow({ x: nx, y: ny }); } catch(e) {}
  }
});

canvas.addEventListener('mousedown', async (e) => {
  if (e.button === 2) return; // right-click handled by contextmenu
  if (!isOverCharacter(e.clientX, e.clientY)) return;

  isDragging = true;
  prevState = state;
  state = 'drag';
  try {
    const pos = await window.pet.getWindowPos();
    dragOff.x = e.screenX - pos.x;
    dragOff.y = e.screenY - pos.y;
  } catch(err) {
    dragOff.x = e.clientX;
    dragOff.y = e.clientY;
  }
});

window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    state = 'talk';
    speechText = pick([
      "Wheee~!",
      "That was fun!",
      "Put me down! :P",
      "Again! Again!",
      "I'm dizzy~",
      "Hi there!",
    ]);
    speechTimer = 2;
    stateTimer = 2;
  }
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  try { window.pet.showContextMenu(); } catch(e) {}
});

canvas.addEventListener('dblclick', (e) => {
  if (!isOverCharacter(e.clientX, e.clientY)) return;
  // Double-click: say something special
  state = 'talk';
  speechText = pick([
    "I like you!",
    "You found my\nsecret! :D",
    "Claude says hi!",
    "Best friends!",
    "*happy dance*",
  ]);
  speechTimer = 3;
  stateTimer = 3;
});

// ── Main loop ───────────────────────────────────────────
let lastT = 0;
let elapsed = 0;

function loop(timestamp) {
  const dt = Math.min((timestamp - lastT) / 1000, 0.1);
  lastT = timestamp;
  elapsed += dt;

  ctx.clearRect(0, 0, W, H);

  // ── Update timers ──
  breathe += dt * 2.2;

  // Blink
  blinkTimer -= dt;
  if (blinkTimer <= 0 && state !== 'sleep') {
    isBlinking = true;
    setTimeout(() => { isBlinking = false; }, 120);
    blinkTimer = rand(2.5, 5.5);
  }

  // State timer
  if (state !== 'drag') {
    stateTimer -= dt;
    if (stateTimer <= 0) switchState();
  }

  // ── Update movement ──
  if (state === 'walk') {
    walkPhase += dt * 7;
    const speed = 55;
    winX += walkDir * speed * dt;
    // Bounce off screen edges
    if (winX < 10)              { winX = 10;              walkDir = 1;  }
    if (winX > screenW - W - 10) { winX = screenW - W - 10; walkDir = -1; }
    try { window.pet.moveWindow({ x: winX, y: winY }); } catch(e) {}
  }

  // Bob
  if (state === 'walk') {
    bobOff = Math.abs(Math.sin(walkPhase)) * -6;
  } else if (state === 'drag') {
    bobOff = Math.sin(elapsed * 8) * 3;
  } else if (state === 'sleep') {
    sleepBob += dt;
    bobOff = Math.sin(sleepBob * 1.5) * 2;
  } else {
    bobOff = Math.sin(elapsed * 1.8) * 2.5;
  }

  const cy = charBaseY + bobOff;

  // ── Draw ──
  // Speech / thought bubble
  if (state === 'talk' && speechTimer > 0) {
    const fadeIn  = Math.min(1, (stateTimer > speechTimer - 0.3 ? (speechTimer - stateTimer + 0.3) / 0.3 : 1));
    const fadeOut = Math.min(1, speechTimer / 0.4);
    drawSpeechBubble(charX, cy - 55, speechText, Math.min(fadeIn, fadeOut));
    speechTimer -= dt;
  }
  if (state === 'think' && speechTimer > 0) {
    const fadeOut = Math.min(1, speechTimer / 0.4);
    drawThoughtBubble(charX, cy - 55, speechText, fadeOut);
    speechTimer -= dt;
  }

  // Zzz for sleep
  if (state === 'sleep') {
    drawSleep(charX, cy, elapsed);
  }

  // Character
  drawCharacter(charX, cy, elapsed);

  // Hover glow
  if (isHovered && !isDragging) {
    ctx.save();
    ctx.globalAlpha = 0.1 + Math.sin(elapsed * 3) * 0.05;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.ellipse(charX, cy, 50, 52, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

// ── Start ───────────────────────────────────────────────
init();
</script>
</body>
</html>
